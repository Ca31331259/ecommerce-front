services:

  ecommerce-front:

    container_name: ecommerce-front

    image: numecos/ecommerce-front:latest

    build:
      context: ..
      dockerfile: docker/Dockerfile

    restart: unless-stopped

    ports:
      - "8081:80"

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

    networks:
      - ecommerce-local

networks:
  ecommerce-local: