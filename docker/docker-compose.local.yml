services:

  ecommerce-front:

    container_name: ecommerce-front

    image: numecos/ecommerce-front:latest

    build:
      context: ..
      dockerfile: docker/Dockerfile

    restart: unless-stopped

    # Puerto del HOST (izquierda) vs. puerto que nginx escucha DENTRO del container (derecha, 80,
    # fijo -- ver Dockerfile) -- pedido real 2026-11-19: antes publicaba en 8081, que en el esquema
    # unificado de puertos de los 4 repos es exclusivamente el backend de Platform/ecommerce (otro
    # proceso), no este frontend -- colisionaba de verdad si los dos corrían a la vez en la misma
    # máquina. 4202 es el mismo puerto que usa `ng serve` en dev (angular.json), para no tener un
    # tercer número distinto según cómo se levante esto.
    ports:
      - "4202:80"

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

    networks:
      - ecommerce-local

networks:
  ecommerce-local: