version: "3.9"

services:

  ecommerce-front:

    container_name: ecommerce-front

    image: numecos/ecommerce-front:latest

    build:

      context: ..

      dockerfile: docker/Dockerfile

    restart: unless-stopped

    healthcheck:

      test:
        [
          "CMD",
          "wget",
          "--spider",
          "-q",
          "http://127.0.0.1/health"
        ]

      interval: 30s

      timeout: 5s

      retries: 5

      start_period: 20s

    networks:

      - clientes

networks:

  clientes:

    external: true