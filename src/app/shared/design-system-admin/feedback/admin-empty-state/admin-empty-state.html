<div class="admin-empty-state">

    <span
        class="admin-empty-state__icon"
        aria-hidden="true">

        <i [class]="resolvedIcon"></i>

    </span>

    <div class="admin-empty-state__information">

        <h3 class="admin-empty-state__title">

            {{ title }}

        </h3>

        @if(description){

            <p class="admin-empty-state__description">

                {{ description }}

            </p>

        }

    </div>

    @if(actions.length){

        <div class="admin-empty-state__actions">

            <ng-content
                select="[adminEmptyStateActions]">
            </ng-content>

        </div>

    }

    @if(metadata.length){

        <div class="admin-empty-state__meta">

            <ng-content
                select="[adminEmptyStateMeta]">
            </ng-content>

        </div>

    }

</div>
