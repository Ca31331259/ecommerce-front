<div class="admin-toast-container">

    @for(toast of toasts(); track toast.id){

        <div
            class="admin-toast"
            [attr.type]="toast.type">

            <div class="admin-toast__message">

                {{ toast.message }}

            </div>

            <button
                type="button"
                (click)="remove(toast.id)">

                <i class="fa-solid fa-xmark"></i>

            </button>

        </div>

    }

</div>
