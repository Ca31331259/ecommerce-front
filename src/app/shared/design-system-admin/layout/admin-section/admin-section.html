<section class="admin-section">

    @if(title || subtitle || actions.length){

        <header class="admin-section__header">

            <div class="admin-section__information">

                @if(title){

                    <h2 class="admin-section__title">

                        {{ title }}

                    </h2>

                }

                @if(subtitle){

                    <p class="admin-section__subtitle">

                        {{ subtitle }}

                    </p>

                }

            </div>

            @if(actions.length){

                <div class="admin-section__actions">

                    <ng-content
                        select="[adminSectionActions]">
                    </ng-content>

                </div>

            }

        </header>

    }

    <div class="admin-section__content">

        <ng-content></ng-content>

    </div>

</section>
