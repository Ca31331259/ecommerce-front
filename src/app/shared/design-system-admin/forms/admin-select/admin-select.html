<div class="admin-select">

    <select
        class="admin-select__native"
        [disabled]="disabled"
        [value]="value ?? ''"
        (change)="onSelectionChange($event)"
        (blur)="onBlur()">

        @if(allowEmpty){

            <option value="">

                {{ placeholder }}

            </option>

        }

        @for(option of options; track option.value){

            <option
                [value]="option.value">

                {{ option.label }}

            </option>

        }

    </select>

    <span
        class="admin-select__icon"
        aria-hidden="true">

        <i class="fa-solid fa-chevron-down"></i>

    </span>

</div>
