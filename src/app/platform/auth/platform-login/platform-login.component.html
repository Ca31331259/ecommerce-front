<div class="platform-login">

    <div class="platform-login__container">


        <!-- ================================================= -->
        <!-- BRAND -->
        <!-- ================================================= -->

        <div class="platform-login__brand">

            <div class="platform-login__logo">

                <span>

                    N

                </span>

            </div>

            <div>

                <strong>

                    Numecos

                </strong>

                <span>

                    Platform

                </span>

            </div>

        </div>


        <!-- ================================================= -->
        <!-- CARD -->
        <!-- ================================================= -->

        <section class="platform-login__card">


            <!-- ============================================= -->
            <!-- HEADER -->
            <!-- ============================================= -->

            <header class="platform-login__header">

                <h1>

                    Iniciar sesión

                </h1>

                <p>

                    Accedé al panel de administración
                    de la plataforma.

                </p>

            </header>


            <!-- ============================================= -->
            <!-- ERROR -->
            <!-- ============================================= -->

            @if (errorMessage) {

                <div
                    class="
                        platform-login__alert
                        platform-login__alert--danger
                    ">

                    <i
                        class="
                            fa-solid
                            fa-circle-exclamation
                        "
                        aria-hidden="true">
                    </i>

                    <span>

                        {{ errorMessage }}

                    </span>

                </div>

            }


            <!-- ============================================= -->
            <!-- FORM -->
            <!-- ============================================= -->

            <form
                [formGroup]="form"
                (ngSubmit)="submit()"
                novalidate>


                <!-- ========================================= -->
                <!-- EMAIL -->
                <!-- ========================================= -->

                <div class="platform-login__field">

                    <label for="email">

                        Email

                    </label>

                    <div
                        class="
                            platform-login__input-wrapper
                        ">

                        <i
                            class="
                                fa-solid
                                fa-envelope
                            "
                            aria-hidden="true">
                        </i>

                        <input
                            id="email"
                            type="email"
                            formControlName="email"
                            autocomplete="username"
                            placeholder="admin@numecos.com"
                            [class.platform-login__input--error]="
                                hasError('email')
                            " />

                    </div>

                    @if (hasError('email')) {

                        <small>

                            {{ getError('email') }}

                        </small>

                    }

                </div>


                <!-- ========================================= -->
                <!-- PASSWORD -->
                <!-- ========================================= -->

                <div class="platform-login__field">

                    <label for="password">

                        Contraseña

                    </label>

                    <div
                        class="
                            platform-login__input-wrapper
                        ">

                        <i
                            class="
                                fa-solid
                                fa-lock
                            "
                            aria-hidden="true">
                        </i>

                        <input
                            id="password"
                            [type]="
                                showPassword
                                    ? 'text'
                                    : 'password'
                            "
                            formControlName="password"
                            autocomplete="current-password"
                            placeholder="••••••••"
                            [class.platform-login__input--error]="
                                hasError('password')
                            " />


                        <button
                            type="button"
                            class="
                                platform-login__password-toggle
                            "
                            [attr.aria-label]="
                                showPassword
                                    ? 'Ocultar contraseña'
                                    : 'Mostrar contraseña'
                            "
                            (click)="togglePassword()">

                            @if (showPassword) {

                                <i
                                    class="
                                        fa-solid
                                        fa-eye-slash
                                    "
                                    aria-hidden="true">
                                </i>

                            } @else {

                                <i
                                    class="
                                        fa-solid
                                        fa-eye
                                    "
                                    aria-hidden="true">
                                </i>

                            }

                        </button>

                    </div>

                    @if (hasError('password')) {

                        <small>

                            {{ getError('password') }}

                        </small>

                    }

                </div>


                <!-- ========================================= -->
                <!-- SUBMIT -->
                <!-- ========================================= -->

                <button
                    type="submit"
                    class="
                        platform-login__submit
                    "
                    [disabled]="loading">

                    @if (loading) {

                        <i
                            class="
                                fa-solid
                                fa-spinner
                                fa-spin
                            "
                            aria-hidden="true">
                        </i>

                        Iniciando sesión...

                    } @else {

                        <span>

                            Iniciar sesión

                        </span>

                        <i
                            class="
                                fa-solid
                                fa-arrow-right
                            "
                            aria-hidden="true">
                        </i>

                    }

                </button>

            </form>


        </section>


        <!-- ================================================= -->
        <!-- FOOTER -->
        <!-- ================================================= -->

        <footer class="platform-login__footer">

            <span>

                Numecos Platform

            </span>

            <span>

                Administración de la plataforma

            </span>

        </footer>


    </div>

</div>
