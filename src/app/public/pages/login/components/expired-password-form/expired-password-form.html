<div class="two-factor-card">

    <h2>Contraseña vencida</h2>

    <p>
        Por razones de seguridad debe establecer una nueva contraseña
        antes de continuar.
    </p>

    <mat-form-field appearance="outline">
        <mat-label>Nueva contraseña</mat-label>

        <input matInput type="password" [(ngModel)]="password">
    </mat-form-field>

    <mat-form-field appearance="outline">
        <mat-label>Confirmar contraseña</mat-label>

        <input matInput type="password" [(ngModel)]="confirmPassword">
    </mat-form-field>

    <div class="password-requirements">

        <div [class.valid]="hasMinLength">
            Al menos 8 caracteres
        </div>

        <div [class.valid]="hasUpperCase">
            Una letra mayúscula
        </div>

        <div [class.valid]="hasLowerCase">
            Una letra minúscula
        </div>

        <div [class.valid]="hasNumber">
            Un número
        </div>

        <div [class.valid]="hasSpecialCharacter">
            Un carácter especial
        </div>

        <div [class.valid]="passwordsMatch">
            Las contraseñas coinciden
        </div>

    </div>

    <button mat-flat-button color="primary" type="button" [disabled]="!canSubmit" (click)="submit()">

        @if(!loading){

        Cambiar contraseña

        }@else{

        Actualizando...

        }

    </button>

</div>
