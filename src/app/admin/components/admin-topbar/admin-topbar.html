<header class="admin-topbar">

    <!-- ========================================= -->
    <!-- START -->
    <!-- ========================================= -->

    <div class="admin-topbar__start">

        <button
            class="admin-topbar__menu"
            type="button"
            aria-label="Abrir navegación"
            (click)="openMobileSidebar()">

            <i
                class="fa-solid fa-bars"
                aria-hidden="true">
            </i>

        </button>

        <div class="admin-topbar__context">

            <span class="admin-topbar__context-label">

                Administración

            </span>

            <strong class="admin-topbar__business-name">

                {{ businessName() }}

            </strong>

        </div>

    </div>

    <!-- ========================================= -->
    <!-- ACTIONS -->
    <!-- ========================================= -->

    <div class="admin-topbar__actions">

        <button
            class="admin-topbar__action"
            type="button"
            aria-label="Ver sitio público"
            title="Ver sitio"
            (click)="openStore()">

            <i
                class="fa-solid fa-arrow-up-right-from-square"
                aria-hidden="true">
            </i>

            <span class="admin-topbar__action-label">

                Ver sitio

            </span>

        </button>

        <span
            class="admin-topbar__separator"
            aria-hidden="true">
        </span>

        <div class="admin-topbar__user">

            <span
                class="admin-topbar__avatar"
                aria-hidden="true">

                {{ businessInitial() }}

            </span>

            <div class="admin-topbar__user-information">

                <strong>

                    Administrador

                </strong>

                <span>

                    {{ businessName() }}

                </span>

            </div>

        </div>

        <button
            class="
                admin-topbar__action
                admin-topbar__action--icon
                admin-topbar__action--danger
            "
            type="button"
            aria-label="Cerrar sesión"
            title="Cerrar sesión"
            (click)="logout()">

            <i
                class="fa-solid fa-arrow-right-from-bracket"
                aria-hidden="true">
            </i>

        </button>

    </div>

</header>
