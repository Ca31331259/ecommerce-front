<admin-form-card
    title="Contraseña"
    subtitle="Actualizá la contraseña utilizada para acceder al sistema.">

    <admin-form-grid columns="2">

        <admin-field
            label="Contraseña actual">

            <input
                adminFieldContent
                adminInput
                type="password"
                [(ngModel)]="model.currentPassword">

        </admin-field>

        <div></div>

        <admin-field
            label="Nueva contraseña">

            <input
                adminFieldContent
                adminInput
                type="password"
                [(ngModel)]="model.newPassword">

        </admin-field>

        <admin-field
            label="Confirmar contraseña">

            <input
                adminFieldContent
                adminInput
                type="password"
                [(ngModel)]="model.confirmPassword">

        </admin-field>

    </admin-form-grid>

    <div class="change-password-form__requirements">

        <h4>
            Requisitos de la contraseña
        </h4>

        <ul>

            <li>
                Al menos 8 caracteres.
            </li>

            <li>
                Una letra mayúscula.
            </li>

            <li>
                Una letra minúscula.
            </li>

            <li>
                Un número.
            </li>

            <li>
                Un carácter especial.
            </li>

        </ul>

    </div>

    <div adminFormCardFooter>

        <admin-button
            variant="primary"
            icon="fa-solid fa-key"
            [loading]="saving"
            (clicked)="savePassword()">

            Cambiar contraseña

        </admin-button>

    </div>

</admin-form-card>
